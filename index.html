<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор YAML</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">
<div class="grid grid-cols-2 gap-4 h-screen">
    <!-- Левая панель -->
    <div class="overflow-y-auto p-4 bg-gray-800 rounded shadow space-y-4">
        <h2 class="text-xl font-bold">Параметры блока</h2>

        <label class="block">
            <span class="text-sm font-medium">Название</span>
            <input id="name" type="text" placeholder="&fТест" class="mt-1 w-full rounded border p-2 bg-gray-700 text-white" />
        </label>

        <label class="block">
            <span class="text-sm font-medium">Тип блока (baseType)</span>
            <input id="baseType" type="text" placeholder="barrier" class="mt-1 w-full rounded border p-2 bg-gray-700 text-white" />
        </label>

        <label class="block">
            <input id="isSolid" type="checkbox" class="mr-2" checked/>Твёрдый (isSolid)
        </label>

        <fieldset class="border p-2 rounded" id="solid-options">
            <legend class="text-sm font-medium">nonSolid</legend>
            <label class="block">Ширина: <input id="nonSolidWidth" type="number" value="1" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
            <label class="block">Высота: <input id="nonSolidHeight" type="number" value="1" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
        <fieldset class="border p-2 rounded">
            <legend class="text-sm font-medium">offset</legend>
            <label class="block">x: <input id="hitboxX" type="number" value="0" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
            <label class="block">y: <input id="hitboxY" type="number" value="0" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
            <label class="block">z: <input id="hitboxZ" type="number" value="0" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
        </fieldset>
            <label class="block"><input id="freePlace" type="checkbox" class="mr-2" />free-place</label>
        </fieldset>

        <label class="block"><input id="canDestroy" type="checkbox" class="mr-2" />canDestroy</label>

        <fieldset class="border p-2 rounded" id="destroy-options">
            <label class="block"><input id="hasDrop" type="checkbox" checked class="mr-2" />hasDrop</label>

            <label class="block">
                <span class="text-sm font-medium">destroy-time</span>
                <input id="destroyTime" type="number" value="2" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" />
            </label>

            <label class="block">
                <span class="text-sm font-medium">Инструмент</span>
                <select id="effectiveTool" class="mt-1 w-full rounded border p-2 bg-gray-700 text-white">
                    <option value="hoe">hoe</option>
                    <option value="axe">axe</option>
                    <option value="pickaxe" selected>pickaxe</option>
                    <option value="sword">sword</option>
                    <option value="shovel">shovel</option>
                </select>
            </label>
        </fieldset>

        <label class="block"><input id="isSeat" type="checkbox" class="mr-2" />isSeat</label>


        <fieldset class="border p-2 rounded" id="seat-options">
            <legend class="text-sm font-medium">seat.offset</legend>
            <div  style="display: grid">
            <label>X: <input id="seatX" type="number" value="0" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>Y: <input id="seatY" type="number" value="0.5" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>Z: <input id="seatZ" type="number" value="0" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label><input id="rotateByPassenger" type="checkbox" class="mr-2" />rotate-by-passenger</label>
            </div>
        </fieldset>

        <fieldset class="border p-2 rounded" style="display: grid">
            <legend class="text-sm font-medium">canPlace</legend>
            <label><input type="checkbox" id="placeNorth" class="mr-2" checked />north</label>
            <label><input type="checkbox" id="placeSouth" class="mr-2" checked />south</label>
            <label><input type="checkbox" id="placeWest" class="mr-2" checked />west</label>
            <label><input type="checkbox" id="placeEast" class="mr-2" checked />east</label>
            <label><input type="checkbox" id="placeUp" class="mr-2" checked />up</label>
            <label><input type="checkbox" id="placeDown" class="mr-2" checked />down</label>
        </fieldset>

        <fieldset class="border p-2 rounded"  style="display: grid">
            <legend class="text-sm font-medium">Модель</legend>
            <label>ID: <input id="modelId" type="text" value="feather" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>CMD: <input id="modelCmd" type="number" value="0" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>Цвет: <input id="modelColor" type="color" value="#FFFFFF" class="ml-2" /></label>
            <label>itemId: <input id="itemId" type="text" value="feather" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>itemCmd: <input id="itemCmd" type="number" value="0" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>itemColor: <input id="itemColor" type="color" value="#FFFFFF" class="ml-2" /></label>


            <label>itemLore (через запятую): <input id="itemLore" type="text" class="bg-gray-700 text-white p-1 rounded ml-2 w-full" /></label>
            <label><input id="isHat" type="checkbox" class="mr-2" />isHat</label>
        </fieldset>

        <br>
        <label><input id="isRotates" type="checkbox" class="mr-2" />isRotates</label>
        <fieldset class="border p-2 rounded" id="rotate-options">
            <div style="display: grid">
                <label><input id="rotate45" type="checkbox" class="mr-2" />45-rotating</label>
                <label><input id="freeRotating" type="checkbox" class="mr-2" />free-rotating</label>
                <label><input id="rotateByBlockface" type="checkbox" class="mr-2" />rotate-by-blockface</label>
                <label class="block" id="binding">
                    <span class="text-sm font-medium">blockface-binding</span>
                    <select id="blockfaceBinding" class="mt-1 w-full rounded border p-2 bg-gray-700 text-white">
                        <option value="down">down</option>
                        <option value="up">up</option>
                        <option value="north" selected>north</option>
                        <option value="south">south</option>
                        <option value="west">west</option>
                        <option value="east">east</option>
                    </select>
                </label>

            </div>
        </fieldset>

        <fieldset class="border p-2 rounded">
            <legend class="text-sm font-medium">Звуки</legend>
            <label>place: <input id="soundPlace" type="text" value="minecraft:block.stone.place" class="bg-gray-700 text-white p-1 rounded ml-2 w-full" /></label>
            <label>break: <input id="soundBreak" type="text" value="minecraft:block.stone.break" class="bg-gray-700 text-white p-1 rounded ml-2 w-full" /></label>
            <label>interact: <input id="soundInteract" type="text" value="minecraft:block.stone.ui.button.click" class="bg-gray-700 text-white p-1 rounded ml-2 w-full" /></label>
        </fieldset>


    </div>

    <!-- Правая панель -->
    <div class="overflow-y-auto p-4 bg-gray-950 text-green-300 rounded shadow">
<!--        <h2 class="text-xl font-bold mb-4">Сгенерированный YAML</h2>-->
        <pre id="codeOutput" class="whitespace-pre-wrap"></pre>
    </div>
</div>

<script>
    function generateCode() {
        const get = id => document.getElementById(id);
        const bool = id => get(id).checked;
        const val = id => get(id)?.value;
        const num = id => Number(val(id)) || 0;

        const yaml = `name: '${val('name') || '&fТест'}'
baseType: ${val('baseType') || 'barrier'}
isSolid: ${bool('isSolid')}
${!bool('isSolid') ? `
nonSolid:
  width: ${num('nonSolidWidth')}
  height: ${num('nonSolidHeight')}
  hitbox-offset:
    x: ${num('hitboxX')}
    y: ${num('hitboxY')}
    z: ${num('hitboxZ')}
  free-place: ${bool('freePlace')}` : ''}
canDestroy: ${bool('canDestroy')}
${bool('canDestroy') ? `
destroy-time: ${num('destroyTime')}
hasDrop: ${bool('hasDrop')}
effectiveTool: ${val('effectiveTool') || 'pickaxe'}` : ''}

${bool('placeNorth') || bool('placeSouth') || bool('placeWest') || bool('placeEast') || bool('placeUp') || bool('placeDown') ? `
canPlace:
${bool('placeNorth') ? `  north: ${bool('placeNorth')}` : ''}${bool('placeSouth') ? `
  south: ${bool('placeSouth')}` : ''}${bool('placeWest') ? `
  west: ${bool('placeWest')}` : ''}${bool('placeEast') ? `
  east: ${bool('placeEast')}` : ''}${bool('placeUp') ? `
  up: ${bool('placeUp')}` : ''}${bool('placeDown') ? `
  down: ${bool('placeDown')}` : ''}` : ''}


isSeat: ${bool('isSeat')}
${bool('isSeat') ? `
seat:
  offset:
    x: ${num('seatX')}
    y: ${num('seatY')}
    z: ${num('seatZ')}
  rotate-by-passenger: ${bool('rotateByPassenger')}
` : ''}
model:
  id: ${val('modelId') || 'gold_ingot'}
  cmd: ${num('modelCmd')}
  color: '${val('modelColor') || '#FFFFFF'}'
  itemId: ${val('itemId') || 'stick'}
  itemCmd: ${num('itemCmd')}
  itemColor: '${val('itemColor') || '#FFFFFF'}'
  isRotates: ${bool('isRotates')}
${bool('rotateByBlockface') ? `
  rotate-by-blockface: ${bool('rotateByBlockface')}` : ''}
${bool('rotate45') ? `
  45-rotating: ${bool('rotate45')}` : ''}
${bool('freeRotating') ? `
  free-rotating: ${bool('freeRotating')}` : ''}
${bool('rotateByBlockface') ? `
  blockface-binding: ${val('blockfaceBinding') || 'down'}` : ''}
  itemLore:
${(val('itemLore') || 'Example, Lore').split(',').map(i => `  - ${i.trim()}`).join('\n')}
  isHat: ${bool('isHat')}
sounds:
  place: ${val('soundPlace') || 'minecraft:block.stone.place'}
  break: ${val('soundBreak') || 'minecraft:block.stone.break'}
  interact: ${val('soundInteract') || 'minecraft:block.stone.ui.button.click'}`;

        get('codeOutput').textContent = yaml;
    }

    function setupAutoUpdate() {
        const allInputs = document.querySelectorAll(
            'input, select, textarea'
        );
        allInputs.forEach(el => {
            const eventType = el.tagName === 'SELECT' ? 'change' : 'input';
            el.addEventListener(eventType, generateCode);
        });
    }

    function toggleOptions(elstr, arr, negative = false) {
        let enabled = document.getElementById(elstr).checked;

        if (negative) {
            enabled = !enabled
        }

        arr.forEach(id => {
            const el = document.getElementById(id)
            if (enabled) {
                el.style.display = "block"
            } else {
                el.style.display = "none"
            }
        });
    }


    window.onload = () => {
        generateCode();

        toggleOptions('isRotates', ['rotate-options']);
        toggleOptions('isSeat', ['seat-options']);
        toggleOptions('isSolid', ['solid-options'], true);
        toggleOptions('canDestroy', ["destroy-options"]);
        toggleOptions('rotateByBlockface', ["binding"]);
        setupAutoUpdate()

        document.getElementById('isRotates').addEventListener('change', () => {
            toggleOptions('isRotates', ['rotate-options']);
            generateCode();
        });

        document.getElementById('isSeat').addEventListener('change', () => {
            toggleOptions('isSeat', ['seat-options']);
            generateCode();
        });

        document.getElementById('isSolid').addEventListener('change', () => {
            toggleOptions('isSolid', ['solid-options'], true);
            generateCode();
        });


        document.getElementById('canDestroy').addEventListener('change', () => {
            toggleOptions('canDestroy', ["destroy-options"]);
            generateCode();
        });

        document.getElementById('rotateByBlockface').addEventListener('change', () => {
            toggleOptions('rotateByBlockface', ["binding"]);
            generateCode();
        });


    };

</script>
</body>
</html>
