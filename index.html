<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор YAML</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4">
<div class="grid grid-cols-2 gap-4 h-screen">
    <!-- Левая панель -->
    <div class="overflow-y-auto p-4 bg-gray-800 rounded shadow space-y-4">
        <h2 class="text-xl font-bold">Параметры блока</h2>

        <label class="block">
            <span class="text-sm font-medium">Название</span>
            <input id="name" type="text" placeholder="&fТест" class="mt-1 w-full rounded border p-2 bg-gray-700 text-white" />
        </label>

        <label class="block">
            <span class="text-sm font-medium">Тип блока (baseType)</span>
            <input id="baseType" type="text" placeholder="barrier" class="mt-1 w-full rounded border p-2 bg-gray-700 text-white" />
        </label>

        <label class="block">
            <input id="isSolid" type="checkbox" class="mr-2" />Твёрдый (isSolid)
        </label>

        <fieldset class="border p-2 rounded">
            <legend class="text-sm font-medium">nonSolid</legend>
            <label class="block">Ширина: <input id="nonSolidWidth" type="number" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
            <label class="block">Высота: <input id="nonSolidHeight" type="number" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
            <label class="block">Хитбокс X: <input id="hitboxX" type="number" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
            <label class="block">Хитбокс Y: <input id="hitboxY" type="number" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
            <label class="block">Хитбокс Z: <input id="hitboxZ" type="number" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" /></label>
            <label class="block"><input id="freePlace" type="checkbox" class="mr-2" />free-place</label>
        </fieldset>

        <label class="block"><input id="canDestroy" type="checkbox" class="mr-2" />canDestroy</label>

        <fieldset class="border p-2 rounded">
            <legend class="text-sm font-medium">canPlace</legend>
            <label><input type="checkbox" id="placeNorth" class="mr-2" />north</label>
            <label><input type="checkbox" id="placeSouth" class="mr-2" />south</label>
            <label><input type="checkbox" id="placeWest" class="mr-2" />west</label>
            <label><input type="checkbox" id="placeEast" class="mr-2" />east</label>
            <label><input type="checkbox" id="placeUp" class="mr-2" />up</label>
            <label><input type="checkbox" id="placeDown" class="mr-2" />down</label>
            <label><input type="checkbox" id="placeInNotSolid" class="mr-2" />in-not-solid</label>
        </fieldset>

        <label class="block">
            <span class="text-sm font-medium">destroy-time</span>
            <input id="destroyTime" type="number" class="w-16 ml-2 bg-gray-700 text-white p-1 rounded" />
        </label>

        <label class="block"><input id="isSeat" type="checkbox" class="mr-2" />isSeat</label>

        <fieldset class="border p-2 rounded">
            <legend class="text-sm font-medium">Модель</legend>
            <label>ID: <input id="modelId" type="text" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>CMD: <input id="modelCmd" type="number" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>Цвет: <input id="modelColor" type="color" class="ml-2" /></label>
            <label>itemId: <input id="itemId" type="text" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>itemCmd: <input id="itemCmd" type="number" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>itemColor: <input id="itemColor" type="color" class="ml-2" /></label>
            <label><input id="isRotates" type="checkbox" class="mr-2" />isRotates</label>
            <label><input id="rotateByBlockface" type="checkbox" class="mr-2" />rotate-by-blockface</label>
            <label><input id="rotate45" type="checkbox" class="mr-2" />45-rotating</label>
            <label><input id="freeRotating" type="checkbox" class="mr-2" />free-rotating</label>
            <label>blockface-binding: <input id="blockfaceBinding" type="text" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>itemLore (через запятую): <input id="itemLore" type="text" class="bg-gray-700 text-white p-1 rounded ml-2 w-full" /></label>
            <label><input id="isHat" type="checkbox" class="mr-2" />isHat</label>
        </fieldset>

        <fieldset class="border p-2 rounded">
            <legend class="text-sm font-medium">seat.offset</legend>
            <label>X: <input id="seatX" type="number" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>Y: <input id="seatY" type="number" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label>Z: <input id="seatZ" type="number" class="bg-gray-700 text-white p-1 rounded ml-2" /></label>
            <label><input id="rotateByPassenger" type="checkbox" class="mr-2" />rotate-by-passenger</label>
        </fieldset>

        <fieldset class="border p-2 rounded">
            <legend class="text-sm font-medium">Звуки</legend>
            <label>place: <input id="soundPlace" type="text" class="bg-gray-700 text-white p-1 rounded ml-2 w-full" /></label>
            <label>break: <input id="soundBreak" type="text" class="bg-gray-700 text-white p-1 rounded ml-2 w-full" /></label>
            <label>interact: <input id="soundInteract" type="text" class="bg-gray-700 text-white p-1 rounded ml-2 w-full" /></label>
        </fieldset>

        <label class="block"><input id="hasDrop" type="checkbox" class="mr-2" />hasDrop</label>

        <label class="block">
            <span class="text-sm font-medium">Инструмент</span>
            <input id="effectiveTool" type="text" placeholder="pickaxe" class="w-full bg-gray-700 text-white p-2 rounded" />
        </label>

        <button onclick="generateCode()" class="bg-blue-600 text-white px-4 py-2 rounded mt-4 w-full">Обновить код</button>
    </div>

    <!-- Правая панель -->
    <div class="overflow-y-auto p-4 bg-gray-950 text-green-300 rounded shadow">
        <h2 class="text-xl font-bold mb-4">Сгенерированный YAML</h2>
        <pre id="codeOutput" class="whitespace-pre-wrap"></pre>
    </div>
</div>

<script>
    function generateCode() {
        const get = id => document.getElementById(id);
        const bool = id => get(id).checked;
        const val = id => get(id)?.value;
        const num = id => Number(val(id)) || 0;

        const yaml = `name: '${val('name') || '&fТест'}'
baseType: ${val('baseType') || 'barrier'}
isSolid: ${bool('isSolid')}
nonSolid:
  width: ${num('nonSolidWidth')}
  height: ${num('nonSolidHeight')}
  hitbox-offset:
    x: ${num('hitboxX')}
    y: ${num('hitboxY')}
    z: ${num('hitboxZ')}
  free-place: ${bool('freePlace')}
canDestroy: ${bool('canDestroy')}
canPlace:
  north: ${bool('placeNorth')}
  south: ${bool('placeSouth')}
  west: ${bool('placeWest')}
  east: ${bool('placeEast')}
  up: ${bool('placeUp')}
  down: ${bool('placeDown')}
  in-not-solid: ${bool('placeInNotSolid')}
destroy-time: ${num('destroyTime')}
isSeat: ${bool('isSeat')}
model:
  id: ${val('modelId') || 'gold_ingot'}
  cmd: ${num('modelCmd')}
  color: '${val('modelColor') || '#FFFFFF'}'
  itemId: ${val('itemId') || 'stick'}
  itemCmd: ${num('itemCmd')}
  itemColor: '${val('itemColor') || '#FFFFFF'}'
  isRotates: ${bool('isRotates')}
  rotate-by-blockface: ${bool('rotateByBlockface')}
  45-rotating: ${bool('rotate45')}
  free-rotating: ${bool('freeRotating')}
  blockface-binding: ${val('blockfaceBinding') || 'down'}
  itemLore:
${(val('itemLore') || 'Example, Lore').split(',').map(i => `  - ${i.trim()}`).join('\n')}
  isHat: ${bool('isHat')}
seat:
  offset:
    x: ${num('seatX')}
    y: ${num('seatY')}
    z: ${num('seatZ')}
  rotate-by-passenger: ${bool('rotateByPassenger')}
sounds:
  place: ${val('soundPlace') || 'minecraft:block.stone.place'}
  break: ${val('soundBreak') || 'minecraft:block.stone.break'}
  interact: ${val('soundInteract') || 'minecraft:block.stone.ui.button.click'}
hasDrop: ${bool('hasDrop')}
effectiveTool: ${val('effectiveTool') || 'pickaxe'}`;

        get('codeOutput').textContent = yaml;
    }

    window.onload = generateCode;
</script>
</body>
</html>
